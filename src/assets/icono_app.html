
<div style="display:flex; flex-direction:column; align-items:center; gap:24px; padding:2rem 0;">
  <canvas id="iconCanvas" width="1024" height="1024" style="width:200px;height:200px;border-radius:22%;"></canvas>
  <div style="display:flex; gap:12px;">
    <button onclick="downloadPNG()" style="padding:10px 20px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:14px;cursor:pointer;">Descargar PNG 1024x1024</button>
  </div>
  <p style="font-size:13px;color:var(--color-text-secondary);">Guardá este PNG como <code>assets/icon.png</code></p>
</div>

<script>
const canvas = document.getElementById('iconCanvas')
const ctx = canvas.getContext('2d')
const s = 1024

// Fondo negro con esquinas redondeadas
const r = 200
ctx.beginPath()
ctx.moveTo(r, 0)
ctx.lineTo(s-r, 0)
ctx.quadraticCurveTo(s, 0, s, r)
ctx.lineTo(s, s-r)
ctx.quadraticCurveTo(s, s, s-r, s)
ctx.lineTo(r, s)
ctx.quadraticCurveTo(0, s, 0, s-r)
ctx.lineTo(0, r)
ctx.quadraticCurveTo(0, 0, r, 0)
ctx.closePath()
ctx.fillStyle = '#111111'
ctx.fill()

// Círculo exterior check
const cx = 512, cy = 480, rad = 260
ctx.beginPath()
ctx.arc(cx, cy, rad, 0, Math.PI*2)
ctx.strokeStyle = '#ffffff'
ctx.lineWidth = 48
ctx.stroke()

// Check mark
ctx.beginPath()
ctx.moveTo(cx - 130, cy + 10)
ctx.lineTo(cx - 30, cy + 120)
ctx.lineTo(cx + 150, cy - 110)
ctx.strokeStyle = '#ffffff'
ctx.lineWidth = 72
ctx.lineCap = 'round'
ctx.lineJoin = 'round'
ctx.stroke()

// Punto decorativo abajo
ctx.beginPath()
ctx.arc(cx, cy + rad + 90, 18, 0, Math.PI*2)
ctx.fillStyle = '#ffffff'
ctx.fill()

function downloadPNG() {
  const link = document.createElement('a')
  link.download = 'icon.png'
  link.href = canvas.toDataURL('image/png')
  link.click()
}
</script>
